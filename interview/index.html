<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>面接RAG｜西岡 和紀</title>
<meta name="description" content="質問を数文字入れるだけで、面接で話す内容をスライド1枚として表示する個人用ナレッジベース。">
<meta name="theme-color" content="#0f2b26">
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#16211f; --muted:#5c6b67;
  --line:#dfdcd3; --accent:#1c5c4f; --accent-soft:#e7f0ec; --warn:#8a5a12; --warn-soft:#fdf3e0;
  --radius:16px; --shadow:0 10px 30px rgba(20,40,35,.08);
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1614; --panel:#152220; --ink:#eef3f1; --muted:#a3b3ae;
    --line:#283a36; --accent:#7fd1ba; --accent-soft:#17302a; --warn:#e6b871; --warn-soft:#2b2216;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1614; --panel:#152220; --ink:#eef3f1; --muted:#a3b3ae;
  --line:#283a36; --accent:#7fd1ba; --accent-soft:#17302a; --warn:#e6b871; --warn-soft:#2b2216;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  line-height:1.75; -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.title-row h1{font-size:1.05rem;margin:0;letter-spacing:.02em}
.title-row span{font-size:.78rem;color:var(--muted)}
.searchbar{display:flex;gap:8px}
.searchbar input{
  flex:1;min-width:0;font-size:16px;padding:13px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink)
}
.searchbar input:focus{outline:2px solid var(--accent);outline-offset:1px}
.searchbar button{
  border:0;border-radius:12px;padding:0 16px;font-size:15px;font-weight:600;
  background:var(--accent);color:var(--bg);cursor:pointer
}
.hint{font-size:.76rem;color:var(--muted);margin:6px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  border-radius:999px;padding:10px 14px;font-size:.92rem;cursor:pointer;min-height:44px
}
.chip:active{transform:scale(.98)}
.chip.primary{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.group-label{font-size:.75rem;letter-spacing:.14em;color:var(--muted);margin:20px 2px 2px}
.slide{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px 18px;margin-top:14px
}
.slide h2{font-size:1.5rem;margin:.1em 0 .1em;line-height:1.35}
.slide .kicker{font-size:.72rem;letter-spacing:.16em;color:var(--accent);margin:0 0 4px;font-weight:700}
.slide .meta{font-size:.78rem;color:var(--muted);margin:0 0 14px}
.talk{
  font-size:1.12rem;background:var(--accent-soft);border-radius:12px;padding:16px;
  margin:0 0 14px;white-space:pre-wrap
}
.talk[contenteditable="true"]{outline:2px dashed var(--accent);outline-offset:2px}
.points{margin:0 0 12px;padding-left:1.2em}
.points li{margin:.3em 0}
.followups{background:var(--warn-soft);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.followups p{margin:0 0 6px;font-size:.78rem;letter-spacing:.1em;color:var(--warn);font-weight:700}
.followups ul{margin:0;padding-left:1.2em;font-size:.95rem}
.note{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.slide-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mini{
  border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;
  padding:9px 12px;font-size:.85rem;cursor:pointer;min-height:40px
}
.mini.on{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.also{margin-top:16px}
.also .group-label{margin-top:0}
.empty{color:var(--muted);font-size:.95rem;padding:10px 2px}
textarea{
  width:100%;min-height:110px;font-size:16px;padding:12px;border-radius:12px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit
}
.memo-item{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;background:var(--panel)}
.memo-item p{margin:0;white-space:pre-wrap}
.memo-item .mini{margin-top:8px}
footer.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
  border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  display:flex;gap:8px;justify-content:center
}
footer.bar button{
  flex:1;max-width:180px;border:1px solid var(--line);background:transparent;color:var(--ink);
  border-radius:12px;padding:11px 8px;font-size:.88rem;cursor:pointer;min-height:44px
}
body.fs-1 .talk{font-size:1.3rem} body.fs-1 .slide h2{font-size:1.7rem} body.fs-1 .points{font-size:1.1rem}
body.fs-2 .talk{font-size:1.55rem} body.fs-2 .slide h2{font-size:2rem} body.fs-2 .points{font-size:1.25rem}
.hidden{display:none !important}
@media print{header.top,footer.bar,.slide-actions,.chips{display:none}.slide{box-shadow:none;page-break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title-row">
      <h1>面接RAG</h1><span>西岡 和紀／質問を数文字入れるだけ</span>
    </div>
    <div class="searchbar">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="例）強み／転職理由／逆質問" autocomplete="off">
      <button id="go" type="button">出す</button>
    </div>
    <p class="hint">面接官の言葉を2〜3文字入れて「出す」。下のボタンは1タップで表示。</p>
  </header>

  <main id="view"></main>
</div>

<footer class="bar">
  <button id="home" type="button">■ 一覧</button>
  <button id="fs" type="button">A 文字大</button>
  <button id="mode" type="button">要点のみ</button>
  <button id="memo" type="button">＋メモ</button>
</footer>
<script>
/* ============================================================
   KB: あなたの素材（ここを書き換えれば全画面に反映されます）
   talk = そのまま話せる原稿 / points = 詰まったとき用の骨だけ
   【 】 は面接前に埋める場所です
   ============================================================ */
const KB = [
{
  id:"self", cat:"基本", q:"自己紹介をお願いします",
  tags:["自己紹介","自己紹介して","じこしょうかい","はじめに","経歴を簡単に","あなたについて","自分のこと","1分で","30秒"],
  talk:"西岡和紀と申します。工学系の出身で、社会人のはじめは企業向け業務システムの開発・導入支援・保守を担当していました。その後、看護師として十一年以上、現場で勤務しながら、電子カルテの導入支援、業務ソフトの開発・運用、職員教育やチーム運営も担当してきました。現在はその両方を土台に、AIやデジタルを現場で実際に使える形へ整える仕事をしています。技術の話を現場の言葉に、現場の困りごとを仕組みに翻訳できることが私の強みです。本日はよろしくお願いいたします。",
  talk60:"西岡和紀と申します。工学系の出身で、はじめは企業向け業務システムの開発・導入支援・保守を担当していました。その後、看護師として十一年以上現場に立ち、患者さんのケアと並行して、電子カルテの導入支援、業務ソフトの開発・運用、職員教育、チーム運営、事業所の管理まで任されてきました。\n現場に入って強く感じたのは、システムは入れて終わりではなく、使う人が迷わない手順まで整えて初めて成果になる、ということです。そこで現在は、AI・デジタル総合支援としてMANATSUKUTOという活動を立ち上げ、ChatGPTなどのAIを業務で使える形に設計し、出力を人が確認する仕組みまで含めて整えています。\n開発の言葉と現場の言葉、その両方を話せることが私の一番の強みです。御社では【 】の領域で、この翻訳役として貢献したいと考えています。",
  points:["工学系 → 企業向け業務システムの開発・導入支援・保守","看護師として11年以上（電子カルテ導入支援／業務ソフト開発・運用／職員教育／チーム運営／事業所管理）","現在：AIジェネラリスト。AI活用の設計と、人が確認する品質管理","一言でいうと『現場と技術の通訳ができる人間』"],
  followups:["なぜ看護師からITへ？ → 「転職理由」","一番の成果は？ → 「実績の言い方」","うちで何ができる？ → 「入社後の貢献」"],
  note:"最初の10秒で『開発 → 看護 → AI』の順番だけ言い切る。詳細は聞かれてから。"
},
{
  id:"career", cat:"基本", q:"これまでの経歴を詳しく教えてください",
  tags:["経歴","けいれき","職務経歴","キャリア","これまで","何をしてきた","職歴","経験"],

  points:["① 企業向け業務システム：開発／導入支援／保守","② 看護11年以上：現場業務＋電子カルテ導入支援＋業務ソフト開発・運用","③ 教育・運営：職員教育、チーム運営、事業所管理","④ 現在：AI活用の設計、資料・制作フロー設計、確認・テスト・品質管理","一貫点：つくる側と使う側、両方の立場を経験している"],
  followups:["どのくらいの規模のチーム？ → 「チーム・育成」","開発から離れていた期間は？ → 「答えにくい質問」"],
  note:"時系列を長く語らない。『三段階でお話しします』と先に宣言すると聞き手が迷わない。"
},
{
  id:"strength", cat:"基本", q:"あなたの強みは何ですか",
  tags:["強み","つよみ","長所","得意","セールスポイント","自己PR","アピール","売り"],
  talk:"三つあります。一つ目は、現場と技術の通訳ができることです。開発側の事情も、実際に使う人が何でつまずくかも、どちらも自分の経験として分かります。二つ目は、曖昧な相談を目的・条件・手順に分解できることです。何がしたいのか本人も整理できていない状態から、確認すべき順番に並べ替えるのが得意です。三つ目は、安全性と優先順位を先に考える進め方です。看護の現場で身についた、確認してから動く、影響範囲を見てから決める、という習慣を、そのまま品質管理に使っています。",
  points:["① 現場と技術の翻訳：両方の言葉を話せる","② 分解力：曖昧な相談 → 目的・条件・手順に整理","③ 安全性と優先順位：確認してから動く（看護で身についた習慣）","→ AI時代に効く：出力をそのまま信じず、人が確認する設計ができる"],
  followups:["それが分かる具体例は？ → 「実績の言い方」で数字に置き換える","逆に弱みは？ → 「弱み」"],
  note:"『三つあります』→ 各30秒。聞かれたら1つ深掘り。全部語り切らない。"
},
{
  id:"weakness", cat:"基本", q:"弱み・短所を教えてください",
  tags:["弱み","よわみ","短所","弱点","じゃくてん","苦手","課題","改善","足りない","直したい"],
  talk:"確認を丁寧にやりすぎて、判断に時間をかけてしまうことがあります。看護の現場では確認不足が事故につながるため、慎重さが身についているのですが、スピードが優先される場面では過剰になり得ると自覚しています。今は、影響が大きい部分と小さい部分をあらかじめ分けて、小さい部分は先に動かして確かめる、という進め方に変えています。締切と確認の深さを最初に合意しておくことで、慎重さを長所として使えるようにしています。",
  points:["弱み：確認を丁寧にやりすぎて判断が遅くなることがある","背景：看護現場の『確認してから動く』習慣","対策：影響の大小で分ける／小さい方は先に動かして検証","対策：締切と確認の深さを着手前に合意する"],
  followups:["ほかには？ → 『一人で抱え込みがち、なので進捗を早めに共有するようにしています』"],
  note:"弱み→背景→今やっている対策、の三点セットで終える。言い訳で終わらない。"
},
{
  id:"why", cat:"基本", q:"転職理由／なぜ看護からこの分野へ？",
  tags:["転職理由","てんしょくりゆう","退職理由","なぜ","理由","看護","看護師","辞めた","キャリアチェンジ","動機"],
  talk:"逃げではなく、やりたいことがはっきりしたためです。看護の現場で電子カルテの導入支援や業務ソフトの開発・運用に関わるうちに、記録や事務に取られている時間を減らせば、人が人に向き合う時間が増えると実感しました。もともと業務システムの開発をしていたこともあり、自分はその仕組みをつくる側で貢献したいと考えるようになりました。看護の経験は捨てるものではなく、現場が何でつまずくかを知っている強みとして、そのまま仕事に活きています。",
  points:["前向きな理由：現場で『仕組みで解決できる』と実感したから","原点：もともと業務システムの開発・導入支援の経験がある","看護は捨てない：現場の詰まりどころが分かる資産として使う","不満・人間関係は理由にしない"],
  followups:["また戻るのでは？ → 『現場に戻る形ではなく、現場を支える側で続けたい』と明言","なぜ今？ → 『AIで実際に業務が変えられる段階になったから』"],
  note:"ネガティブな言葉（忙しい・待遇・人間関係）は一切出さない。"
},
{
  id:"motivation", cat:"基本", q:"志望動機を教えてください",
  tags:["志望動機","しぼうどうき","なぜうち","なぜ弊社を選んだ","選んだ理由","当社","志望","応募理由","なぜ弊社","入社したい"],
  talk:"御社の【事業・サービス名】に、自分の経験が直接活きると考えたためです。私は【御社の課題・注力領域】のような場面で、現場の人が実際に使えるところまで落とし込む役割を担ってきました。特に【自分の経験：例）電子カルテ導入時に、現場が使う手順書と教育まで整えたこと】は、御社で【期待される役割】に応用できると思っています。技術を入れることではなく、使われて成果が出るところまで持っていくことに関心があり、その姿勢が御社の【企業姿勢・理念の言葉】と重なると感じました。",

  followups:["同業他社ではなく なぜ？ → 【他社との違い】を1つだけ具体的に挙げる","入ってやりたいことは？ → 「入社後の貢献」"],

  id:"contribution", cat:"基本", q:"入社後、どんな貢献ができますか",

  points:["① 現場ヒアリング → 要件整理","② AI活用・自動化（資料作成／要約・比較／Excel・データ処理）","③ 導入後の定着支援（手順書・教育・問い合わせ対応）","最後は必ず『まず既存業務を早く覚える』で謙虚に締める"],

},
{

  points:["AI：ChatGPT／Codex／複数AIの役割設計","事務・データ：Excel・VBA、データ処理の整理・自動化","制作：文章、説明資料、提案資料、マニュアル","開発まわり：GitHub","品質：確認・テスト・品質管理の設計","資格：看護師免許"],

{

/* ============================ 検索エンジン（ローカル） ============================ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const norm = s => (s||"").toString().toLowerCase()
  .replace(/[ァ-ン]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60))
  .replace(/[\s、。・．,.!?？！「」『』（）()"'’]/g, "");
const bigrams = s => { const o=[]; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o.length?o:[s]; };

function memos(){ return LS.get("rag.memos", []); }
function corpus(){
  const cards = KB.map(c => ({
    ...c,
    text: norm([c.q, (c.tags||[]).join(""), (c.points||[]).join(""), c.talk, c.note].join(""))
  }));
  const ms = memos().map((m,i) => ({
    id:"memo-"+i, cat:"メモ", q:(m.text||"").slice(0,22)+((m.text||"").length>22?"…":""),
    tags:[], talk:m.text, points:[], followups:[], note:"自分で追加したメモ", isMemo:true, memoIndex:i,
    text: norm(m.text)
  }));
  return cards.concat(ms);
}
function search(input, loose){
  const q = norm(input);
  if(!q) return [];
  const qb = bigrams(q);
  return corpus().map(c => {
    let s = 0;
    for(const t of (c.tags||[])){
      const nt = norm(t);
      if(!nt) continue;
      if(nt === q) s += 60;
      else if(nt.includes(q) && q.length >= 2) s += 30;
      else if(q.includes(nt) && nt.length >= 2) s += 24;
    }
    if(norm(c.q).includes(q) && q.length >= 2) s += 22;
    let hit = 0;
    for(const g of qb) if(c.text.includes(g)) hit++;
    s += (hit / qb.length) * 18;
    return { card:c, score:s };
  }).filter(r => r.score >= (loose ? 1 : 6)).sort((a,b) => b.score - a.score);
}

document.body.className = "fs-" + state.fs;

function talkOf(card){
  const edited = LS.get("rag.edit."+card.id, null);
  if(edited !== null) return edited;
  return (state.long[card.id] && card.talk60) ? card.talk60 : card.talk;
}

      `<button class="chip primary" data-open="${c.id}">${esc(c.q)}</button>`).join("") + '</div>';
  for(const cat of cats.filter(c=>c!=="基本")){
    html += `<p class="group-label">${esc(cat)}</p><div class="chips">` +
      KB.filter(c=>c.cat===cat).map(c => `<button class="chip" data-open="${c.id}">${esc(c.q)}</button>`).join("") +
      '</div>';
  }
  const ms = memos();
  if(ms.length){
    html += '<p class="group-label">自分で足したメモ</p>';
    ms.forEach((m,i) => {
      html += `<div class="memo-item"><p>${esc(m.text)}</p><button class="mini" data-delmemo="${i}">削除</button></div>`;
    });
  }
  html += '<p class="group-label">使い方</p><div class="slide"><ul class="points">' +
    '<li>面接官の質問から2〜3文字だけ入力して「出す」（例：強み／なぜうち／逆質問）</li>' +
    '<li>スライドの原稿はタップして直接書き換えできます（この端末に保存）</li>' +
    '<li>「＋メモ」で足した内容も検索対象になります（＝あなた専用のRAG）</li>' +
    '<li>本番前に【 】の空欄を埋めてください（企業名・事業・入社可能日など）</li>' +
    '</ul></div>';
  view.innerHTML = html;
  window.scrollTo(0,0);
}

function renderCard(card, others){
  state.current = card.id;
  const showTalk = state.mode === "full";
  const hasLong = !!card.talk60;
  let html = '<article class="slide">';
  html += `<p class="kicker">${esc(card.cat)}</p><h2>${esc(card.q)}</h2>`;
  html += `<p class="meta">${showTalk ? "原稿はタップで書き換え可（この端末に保存）" : "要点のみ表示中"}</p>`;
  if(showTalk) html += `<div class="talk" id="talk" data-id="${card.id}">${esc(talkOf(card))}</div>`;
  if((card.points||[]).length) html += '<ul class="points">' + card.points.map(p=>`<li>${esc(p)}</li>`).join("") + '</ul>';
  if((card.followups||[]).length){
    html += '<div class="followups"><p>想定される深掘り</p><ul>' +
      card.followups.map(f=>`<li>${esc(f)}</li>`).join("") + '</ul></div>';
  }
  if(card.note) html += `<p class="note">▸ ${esc(card.note)}</p>`;
  html += '<div class="slide-actions">';
  if(hasLong) html += `<button class="mini ${state.long[card.id]?"on":""}" data-long="${card.id}">${state.long[card.id]?"30秒版に戻す":"60秒版にする"}</button>`;
  if(showTalk) html += `<button class="mini" data-edit="${card.id}">原稿を編集</button>`;
  if(LS.get("rag.edit."+card.id,null)!==null) html += `<button class="mini" data-reset="${card.id}">編集を戻す</button>`;
  if(card.isMemo) html += `<button class="mini" data-delmemo="${card.memoIndex}">このメモを削除</button>`;
  html += '</div></article>';
  if(others && others.length){
    html += '<div class="also"><p class="group-label">近い質問</p><div class="chips">' +
      others.slice(0,5).map(c=>`<button class="chip" data-open="${c.id}">${esc(c.q)}</button>`).join("") +
      '</div></div>';
  }
  view.innerHTML = html;
  window.scrollTo(0,0);
}

function byId(id){ return corpus().find(c => c.id === id); }

function doSearch(){
  const val = document.getElementById("q").value.trim();
  if(!val){ renderHome(); return; }
  let res = search(val);
  if(!res.length) res = search(val, true).slice(0,3);
  if(!res.length){
    view.innerHTML = `<div class="slide"><h2>該当なし</h2><p class="empty">「${esc(val)}」に近いカードが見つかりませんでした。下の一覧から選ぶか、別の言葉でお試しください。</p><div class="slide-actions"><button class="mini" data-home="1">一覧を見る</button><button class="mini" data-addmemo="${esc(val)}">この内容をメモに追加</button></div></div>`;
    return;
  }
  renderCard(res[0].card, res.slice(1).map(r=>r.card));
}

/* ============================ 操作 ============================ */
document.getElementById("go").addEventListener("click", doSearch);
document.getElementById("q").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); document.getElementById("q").blur(); doSearch(); }});
document.getElementById("home").addEventListener("click", () => { document.getElementById("q").value=""; renderHome(); });
document.getElementById("fs").addEventListener("click", () => {
  state.fs = (state.fs + 1) % 3; LS.set("rag.fs", state.fs);
  document.body.className = "fs-" + state.fs;
});
document.getElementById("mode").addEventListener("click", () => {
  state.mode = state.mode === "full" ? "points" : "full";
  LS.set("rag.mode", state.mode);
  document.getElementById("mode").textContent = state.mode==="full" ? "要点のみ" : "原稿を出す";
  if(state.current){ const c = byId(state.current); if(c){ renderCard(c, []); return; } }
  renderHome();
});
document.getElementById("memo").addEventListener("click", () => {
  view.innerHTML = '<div class="slide"><h2>メモを追加</h2><p class="meta">ここに書いた内容も検索対象になります（この端末に保存）。</p>'
    + '<textarea id="memoText" placeholder="例）〇〇社は△△の内製化に注力。面接官は□□部の方。"></textarea>'
    + '<div class="slide-actions"><button class="mini on" data-savememo="1">保存する</button><button class="mini" data-home="1">やめる</button></div></div>';
  window.scrollTo(0,0);
  document.getElementById("memoText").focus();
});

view.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-home],[data-long],[data-edit],[data-reset],[data-savememo],[data-delmemo],[data-addmemo]");
  if(!t) return;
  if(t.dataset.open){ const c = byId(t.dataset.open); if(c) renderCard(c, []); return; }
  if(t.dataset.home){ renderHome(); return; }
  if(t.dataset.long){ const id = t.dataset.long; state.long[id] = !state.long[id]; renderCard(byId(id), []); return; }
  if(t.dataset.edit){
    const el = document.getElementById("talk");
    if(!el) return;
    if(el.getAttribute("contenteditable") === "true"){
      el.setAttribute("contenteditable","false");
      LS.set("rag.edit."+el.dataset.id, el.innerText);
      t.textContent = "原稿を編集";
      renderCard(byId(el.dataset.id), []);
    } else {
      el.setAttribute("contenteditable","true");
      t.textContent = "編集を保存";
      el.focus();
    }
    return;
  }
  if(t.dataset.reset){
    try{ localStorage.removeItem("rag.edit."+t.dataset.reset); }catch(err){}
    renderCard(byId(t.dataset.reset), []);
    return;
  }
  if(t.dataset.savememo){
    const txt = (document.getElementById("memoText").value || "").trim();
    if(txt){ const ms = memos(); ms.push({text:txt}); LS.set("rag.memos", ms); }
    renderHome();
    return;
  }
  if(t.dataset.addmemo){
    const ms = memos(); ms.push({text:t.dataset.addmemo}); LS.set("rag.memos", ms);
    renderHome();
    return;
  }
  if(t.dataset.delmemo !== undefined){
    const ms = memos(); ms.splice(Number(t.dataset.delmemo), 1); LS.set("rag.memos", ms);
    renderHome();
    return;
  }
});

renderHome();
</script>
</body>
</html>
