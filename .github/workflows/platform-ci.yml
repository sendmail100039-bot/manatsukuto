name: Platform CI

on:
  push:
    branches: ["main", "claude/**"]
    paths-ignore: ["site/**", "README.md"]
  pull_request:
    paths-ignore: ["site/**", "README.md"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://platform:platform@127.0.0.1:5433/postgres
      APP_SECRET: ci-only-secret-not-for-production-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Integration tests (PostgreSQL)
        run: pnpm test:integration
      - name: Build web
        run: pnpm build
      - name: Migration files are up to date with the schema
        run: |
          pnpm db:generate --name ci-check || true
          if git status --porcelain packages/database/migrations | grep -v 'ci-check' | grep -q .; then
            echo "Schema and migrations diverged. Run 'pnpm db:generate' and commit." >&2
            git status --porcelain packages/database/migrations >&2
            exit 1
          fi
