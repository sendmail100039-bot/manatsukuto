# Local / self-hosted deployment (§42). HTTPS is terminated by Caddy (§27).
# Usage: docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" on purpose - the database is never exposed outside the compose network (§28).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      target: worker
    command: ["sh", "-c", "pnpm db:migrate && pnpm db:seed"]
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      SEED_ADMIN_LOGIN: ${SEED_ADMIN_LOGIN:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      APP_SECRET: ${APP_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN in .env}
      TRUST_PROXY: "true"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://platform:${POSTGRES_PASSWORD}@postgres:5432/platform
      APP_SECRET: ${APP_SECRET}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
    volumes:
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?public hostname, e.g. kintai.example.com}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
